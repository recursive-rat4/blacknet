[network]
## Minimum transaction fee rate
min_relay_fee_rate="500 sat/B"

## Network settings for p2p connections
ipv4=true
ipv6=true
listen=true
port=28453
tor=true
i2p=true

## Forward p2p port if listening
natpmp=true

## Maximum number of incoming connections
incoming_connections=128

## Maximum number of outgoing connections
outgoing_connections=8

## Database cache size
db_cache="128 MiB"

## Do not create blocks larger than this limit
soft_block_size_limit="2 MB"

## Transaction memory pool size
tx_pool_size="128 MiB"

## Include IP and other network addresses in debug output
log_endpoint=false

## SOCKS5 proxy for outgoing TCP/IP connections
# [network.proxy]
# host="127.0.0.1"
# port=9050

## I2P SAM application bridge
[network.i2p_sam]
host="127.0.0.1"
port=7656

## Tor proxy for onion connections
[network.tor_proxy]
host="127.0.0.1"
port=9050

## Tor control port
[network.tor_control]
host="127.0.0.1"
port=9051

## RPC server
[rpc]
enabled=true

[rpc.bind]
host="127.0.0.1"
port=8283
